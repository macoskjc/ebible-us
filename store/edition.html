<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>eBible.org Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1a3a5c;
    --navy-dark: #0f2440;
    --gold: #b8860b;
    --gold-light: #d4a017;
    --paper: #f8f7f4;
    --ink: #222;
    --muted: #666;
    --border: #ddd;
  }
  * , *::before, *::after { box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    margin: 0;
    line-height: 1.5;
  }
  a { color: inherit; }

  .ebible-logo {
    background: url('https://ebible.org/icon/eBibleorglogo.svg') no-repeat 50% 5%;
    background-size: 100% 145%;
    border-radius: 50%;
    display: inline-block;
  }
  .ebible-logo-nav { width: 40px; height: 40px; }

  .site-nav {
    background: var(--navy-dark);
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.35);
  }
  .site-nav-inner {
    max-width: 1200px; margin: 0 auto; padding: 10px 24px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .navbar-brand {
    display: flex; align-items: center; gap: 10px; text-decoration: none;
    color: #fff; font-family: 'Lora', serif; font-weight: 600; font-size: 1.1rem;
    margin-right: auto;
  }
  .nav-links { list-style: none; display: flex; gap: 18px; margin: 0; padding: 0; flex-wrap: wrap; }
  .nav-links a { text-decoration: none; color: #cfd8e3; font-size: .92rem; font-weight: 500; padding: 6px 2px; }
  .nav-links a:hover, .nav-links a.current { color: #fff; }
  .nav-links a.current { border-bottom: 2px solid var(--gold); }

  .breadcrumb {
    max-width: 1000px; margin: 0 auto; padding: 1.2rem 24px 0;
    font-size: .85rem;
  }
  .breadcrumb a { color: var(--navy); text-decoration: none; font-weight: 600; }
  .breadcrumb a:hover { text-decoration: underline; }

  .detail-wrap {
    max-width: 1000px; margin: 0 auto; padding: 1.2rem 24px 3rem;
    display: grid; grid-template-columns: minmax(240px, 360px) 1fr; gap: 2.4rem;
  }
  .detail-img {
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    padding: 1.5rem; text-align: center; align-self: start;
  }
  .detail-img img { max-width: 100%; max-height: 480px; object-fit: contain; }
  .detail-img .no-cover {
    font-family: 'Lora', serif; font-style: italic; color: var(--muted);
    padding: 3rem 1rem;
  }

  .detail-title { font-family: 'Lora', serif; font-weight: 600; font-size: 1.6rem; margin: 0 0 .4rem; }
  .detail-family { font-size: 1rem; color: var(--muted); margin: 0 0 1rem; }
  .badges { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.3rem; }
  .badge {
    font-size: .72rem; padding: .22rem .6rem; border-radius: 4px;
    font-weight: 600; text-transform: uppercase; letter-spacing: .03em;
  }
  .badge-extent  { background: #dcfce7; color: #166534; }
  .badge-print   { background: #fef3c7; color: #92400e; }
  .badge-binding { background: #dbeafe; color: #1e40af; }

  .spec-table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; font-size: .92rem; }
  .spec-table tr { border-bottom: 1px solid #eee; }
  .spec-table td { padding: .5rem .2rem; vertical-align: top; }
  .spec-table td:first-child { color: var(--muted); font-weight: 600; width: 40%; }
  .spec-table .mm { color: #999; font-size: .85rem; }

  .detail-notes {
    background: #fff; border: 1px solid var(--border); border-radius: 8px;
    padding: 1rem 1.2rem; margin-bottom: 1.5rem; font-size: .9rem; color: var(--ink);
  }
  .detail-notes h2 { font-family: 'Lora', serif; font-size: 1rem; margin: 0 0 .5rem; color: var(--navy); }

  .buy-section h2 { font-family: 'Lora', serif; font-size: 1.05rem; margin: 0 0 .7rem; }
  .buy-list { display: flex; flex-direction: column; gap: .6rem; max-width: 420px; }
  .btn-buy {
    display: flex; justify-content: space-between; align-items: center; gap: .5rem;
    padding: .7rem 1rem; background: var(--navy); color: #fff; text-decoration: none;
    border-radius: 6px; font-size: .92rem; font-weight: 600;
    transition: background .15s;
  }
  .btn-buy:hover { background: var(--navy-dark); }
  .btn-buy .price { font-weight: 700; color: var(--gold-light); }
  .btn-buy.out-of-stock { background: #999; pointer-events: none; }
  .btn-buy.btn-download { background: #1a7a4c; justify-content: center; }
  .btn-buy.btn-download:hover { background: #145c3a; }
  .kindle-note {
    display: block; text-align: center; font-size: .8rem; color: var(--muted);
    text-decoration: none; margin-top: .3rem;
  }
  .kindle-note:hover { color: var(--navy); text-decoration: underline; }

  .not-found { text-align: center; padding: 4rem 1.5rem; color: var(--muted); }
  .not-found a { color: var(--navy); font-weight: 600; }

  footer {
    text-align: center; padding: 2rem; font-size: .82rem; color: #999;
    border-top: 1px solid var(--border); background: #fff; margin-top: 2rem;
  }
  footer a { color: var(--navy); text-decoration: none; }

  @media (max-width: 700px) {
    .detail-wrap { grid-template-columns: 1fr; gap: 1.4rem; }
    .detail-img { padding: 1rem; }
  }
</style>
</head>
<body>

<nav class="site-nav" role="navigation" aria-label="Main navigation">
  <div class="site-nav-inner">
    <a class="navbar-brand" href="https://ebible.org/">
      <div class="ebible-logo ebible-logo-nav" role="img" aria-label="eBible.org logo"></div>
      eBible.org
    </a>
    <ul class="nav-links">
      <li><a href="https://ebible.org/study/">Read Online</a></li>
      <li><a href="https://ebible.org/find/">Find a Translation</a></li>
      <li><a href="https://ebible.org/download.php">Download</a></li>
      <li><a href="./" class="current">Store</a></li>
      <li><a href="https://ebible.org/about.php">About</a></li>
    </ul>
  </div>
</nav>

<p class="breadcrumb"><a href="./">← Back to the store</a></p>

<div id="content"></div>

<footer>
  Site copyright &copy; 2009–2026 eBible.org &nbsp;|&nbsp;
  <a href="https://ebible.org/privacy.php">Privacy Policy</a>
</footer>

<script src="common.js"></script>
<script src="edition.js"></script>
</body>
</html>
